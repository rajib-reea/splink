version: '3.1'

services:

  postgres-splink:
    image: postgres:18.0
    container_name: splink-db-postgres
    restart: always
    environment:
      POSTGRES_USER: splinkognito
      POSTGRES_PASSWORD: splink123!
      POSTGRES_DB: splink_db
    ports:
      - 5432:5432

  pgad:
    image: dpage/pgadmin4:latest
    container_name: splink-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: a@b.com
      PGADMIN_DEFAULT_PASSWORD: b
    ports:
      - 80:80
    volumes:
      - ./servers.json:/pgadmin4/servers.json

  spark-master:
    image: apache/spark:3.5.3
    container_name: splink-spark-master
    restart: always
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - 8080:8080  # Spark Master Web UI
      - 7077:7077  # Spark Master Port

  spark-worker:
    image: apache/spark:3.5.3
    container_name: splink-spark-worker
    restart: always
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - 8081:8081  # Spark Worker Web UI
